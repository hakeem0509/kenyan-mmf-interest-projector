<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMF Interest Projector | O.X. Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-emerald-400">MMF Projector</h1>
        <p class="text-slate-400 text-sm mb-6">Calculate your compounding wealth (KES).</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">Monthly Deposit (KES)</label>
                <input id="deposit" type="number" value="5000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">Annual Yield (%)</label>
                <input id="yield" type="number" value="11" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="calculate()" class="w-full bg-emerald-600 hover:bg-emerald-500 transition-colors py-4 rounded-xl font-bold mt-4">Project Growth</button>
        </div>

        <div id="result" class="mt-8 p-6 bg-slate-900 rounded-2xl hidden">
            <p class="text-slate-400 text-sm">Estimated 5-Year Balance:</p>
            <h2 id="total" class="text-3xl font-black text-emerald-400 mt-1"></h2>
        </div>
    </div>

    <script>
        function calculate() {
            let d = parseFloat(document.getElementById('deposit').value);
            let r = (parseFloat(document.getElementById('yield').value) / 100) / 12;
            let total = 0;
            for (let i = 0; i < 60; i++) { total = (total + d) * (1 + r); }
            document.getElementById('total').innerText = "KES " + total.toLocaleString();
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
